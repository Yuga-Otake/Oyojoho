name: Deploy to GitHub Pages

on:
  push:
    branches:
      - "claude/applied-info-learning-app-a1ypjb"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 実行中のデプロイは中断せず、順番に処理する
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # enablement: true で、未設定ならPages自体を有効化する
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      # ビルド不要の静的サイトなので、リポジトリの内容をそのまま公開する
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
