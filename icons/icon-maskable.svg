<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1b4d"/>
      <stop offset="0.55" stop-color="#1d3fc4"/>
      <stop offset="1" stop-color="#6d36e6"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.42" r="0.55">
      <stop offset="0" stop-color="#7fd8ff" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#7fd8ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="check" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#7ff0ff"/>
    </linearGradient>
    <linearGradient id="hex" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9fe7ff" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#9fb4ff" stop-opacity="0.55"/>
    </linearGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="9" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="512" height="512" fill="url(#bg)"/>
  <g transform="translate(51.2 51.2) scale(0.8)">
  <!-- 背景のグリッド -->
  <g stroke="#ffffff" stroke-opacity="0.06" stroke-width="2">
  </g>
  <circle cx="256" cy="236" r="230" fill="url(#glow)"/>
  <!-- 回路のトレース -->
  <g fill="none" stroke="#8fd9ff" stroke-opacity="0.55" stroke-width="7" stroke-linecap="round" stroke-linejoin="round">
    <path d="M118 166 L74 166 L54 146"/>
    <path d="M118 318 L74 318 L54 338"/>
    <path d="M394 166 L438 166 L458 146"/>
    <path d="M256 412 L256 452"/>
  </g>
  <g fill="#bff2ff">
    <circle cx="54" cy="146" r="10"/><circle cx="54" cy="338" r="10"/>
    <circle cx="458" cy="146" r="10"/><circle cx="256" cy="458" r="10"/>
  </g>
  <!-- 六角形のバッジ -->
  <path d="M256 70 L394 150 L394 330 L256 410 L118 330 L118 150 Z" fill="#0a1440" fill-opacity="0.35" stroke="url(#hex)" stroke-width="14" stroke-linejoin="round"/>
  <!-- 上向きに伸びるチェックマーク(合格)。六角形の外へ突き抜ける -->
  <g filter="url(#soft)">
    <path d="M172 246 L232 304 L336 183" fill="none" stroke="url(#check)" stroke-width="40" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M382 128 L366 202 L310 156 Z" fill="#7ff0ff" stroke="#7ff0ff" stroke-width="6" stroke-linejoin="round"/>
  </g>
  <!-- きらめき -->
  <g fill="#ffffff">
    <path d="M404 82 l6 16 16 6 -16 6 -6 16 -6 -16 -16 -6 16 -6z" fill-opacity="0.9"/>
    <path d="M150 104 l4 10 10 4 -10 4 -4 10 -4 -10 -10 -4 10 -4z" fill-opacity="0.6"/>
  </g>
  </g>
</svg>
